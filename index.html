<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurti Background Maker</title>
<style>
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#fff;color:#222}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.kb{max-width:480px;margin:0 auto;font-size:14px;padding:.5rem 0}
.kb canvas{width:100%;height:auto;display:block;border-radius:12px;border:0.5px solid var(--border,#ddd)}
.kb .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.kb button{min-height:44px;width:100%;font-size:14px;border:0.5px solid var(--border-strong,#bbb);border-radius:var(--radius,8px);background:transparent;color:inherit}
.kb select,.kb input[type=number]{width:100%;min-height:36px;font-size:14px;border:0.5px solid var(--border,#ccc);border-radius:var(--radius,8px);padding:0 8px;background:transparent;color:inherit;box-sizing:border-box}
.kb .row{display:flex;align-items:center;gap:10px;margin:8px 0}
.kb .row label{color:var(--text-secondary,#666);min-width:96px}
.kb .row input[type=range]{flex:1;min-width:0}
.kb .lbl{display:block;color:var(--text-secondary,#666);font-size:13px;margin:0 0 4px}
.kb .msg{font-size:13px;min-height:20px;margin:6px 0}
.kb .err{color:var(--text-danger,#c00)}
</style>
</head>
<body>
<h2 class="sr-only">1000 background styles ke saath kurti PNG lagane aur bulk ZIP download karne ka tool</h2>
<div class="kb">
<input id="file" type="file" accept="image/png,image/webp" aria-label="Kurti PNG chunein" style="width:100%;margin:0 0 10px;color:var(--text-secondary,#666)">
<canvas id="cv" width="1080" height="1350"></canvas>
<p id="nm" style="margin:10px 0 4px;font-weight:500"></p>
<div class="row"><label for="st">Style number</label><input id="st" type="number" min="1" max="1000" value="1" style="width:120px"></div>
<div class="g2"><button id="pv">Pichla style</button><button id="nx">Agla style</button></div>
<div class="g2"><button id="rd">Random style</button><button id="dl">Ye image download</button></div>
<div class="row"><label for="size">Size</label><input id="size" type="range" min="50" max="120" step="1" value="90"></div>
<div class="row"><label for="pos">Left-right</label><input id="pos" type="range" min="-300" max="300" step="5" value="0"></div>
<div class="row"><label for="lift">Upar-neeche</label><input id="lift" type="range" min="-250" max="250" step="5" value="0"></div>
<p id="err" class="msg err"></p>
<p style="font-weight:500;margin:12px 0 6px;border-top:0.5px solid var(--border,#ddd);padding-top:12px">Bulk banayein</p>
<div class="g2"><div><span class="lbl">Kitni images (1 se 100)</span><input id="cnt" type="number" min="1" max="100" value="20"></div><div><span class="lbl">Style chunav</span><select id="mode"><option value="rnd">Random, sab alag</option><option value="seq">Is style se aage</option></select></div></div>
<div class="g2"><div><span class="lbl">Format</span><select id="fmt"><option value="jpg">JPG, chhoti file</option><option value="png">PNG</option></select></div><div style="display:flex;align-items:flex-end"><button id="bk">ZIP banao</button></div></div>
<p id="prog" class="msg"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
